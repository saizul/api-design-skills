name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zips:
    name: Attach skill zips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate before packaging
        run: |
          pip install pyyaml
          python tools/validate_skills.py
      - name: Build zips
        run: |
          mkdir -p dist
          cd skills
          for dir in */; do
            name="${dir%/}"
            zip -qr "../dist/${name}.zip" "$name" -x '*/__pycache__/*' '*.pyc'
          done
          zip -qr ../dist/api-design-skills-all.zip . -x '*/__pycache__/*' '*.pyc'
          cd ..
          ls -l dist
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
